name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: python3 native/patch.py
      - run: python3 native/icon.py
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoftPlayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  mb_publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: mb_out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK=$(find mb_out -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No APK found in the artifacts"; exit 1; fi
          cp "$APK" app.apk
          gh release create "apk-${{ github.run_number }}" app.apk --title "APK build ${{ github.run_number }}" --notes "Built with Multi Bundle" --target "$GITHUB_SHA"
